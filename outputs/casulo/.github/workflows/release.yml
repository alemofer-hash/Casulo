name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-release:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip

      - name: Install release toolchain
        run: python -m pip install --upgrade pip build twine

      - name: Test source
        run: |
          python -m pip install -e ".[dev]"
          python -m pytest -q tests/product tests/test_casulo.py tests/test_t_frontend.py tests/test_t_semantics_ir.py tests/test_t_workspace.py tests/test_t_tcap.py tests/test_t_metamorphosis.py::TMetamorfoseGraphTests

      - name: Build distributions
        run: |
          export SOURCE_DATE_EPOCH="$(git log -1 --pretty=%ct)"
          python -m build
          python tools/normalize_sdist.py dist/*.tar.gz

      - name: Validate metadata
        run: python -m twine check dist/*

      - name: Smoke test wheel
        run: |
          python -m venv wheel-smoke
          wheel-smoke/bin/python -m pip install dist/*.whl
          wheel-smoke/bin/t doctor

      - name: Create checksums
        run: sha256sum dist/* > SHA256SUMS.txt

      - uses: actions/upload-artifact@v4
        with:
          name: casulo-${{ github.ref_name }}
          path: |
            dist/*
            SHA256SUMS.txt

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* SHA256SUMS.txt --verify-tag --generate-notes
