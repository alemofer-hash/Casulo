name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11", "3.12", "3.13"]

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"

      - name: Product and compiler correctness tests
        run: >-
          python -m pytest -q
          tests/product
          tests/test_casulo.py
          tests/test_t_frontend.py
          tests/test_t_semantics_ir.py
          tests/test_t_workspace.py
          tests/test_t_tcap.py
          tests/test_t_metamorphosis.py::TMetamorfoseGraphTests
          --cov=casulo
          --cov-report=term

      - name: Check canonical T program
        run: t check examples/t/balanco_hidrico.t

      - name: Doctor
        run: t doctor

      - name: Adaptive decision smoke
        run: t run examples/t/balanco_hidrico.t --input examples/t/hydrocell_batch.json --adaptive

      - name: Native C99 smoke
        run: |
          t build examples/t/balanco_hidrico.t --output build/native-smoke --native
          t run build/native-smoke --input benchmarks/data/water-balance-f64.json --native --native-required

      - name: Build distributions
        run: python -m build

      - name: Validate distributions
        run: python -m twine check dist/*
