[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "casulo-public"
version = "0.1.0a1"
description = "Cliente mundial do Casulo Cloud first-party."
requires-python = ">=3.11"
license = "MIT"
dependencies = ["casulo==0.25.0a1"]

[tool.setuptools.packages.find]
where = ["src"]
