[package]
name = "casulo-owner-ui"
version = "0.1.0"
description = "Casulo owner Hosted presentation bridge"
authors = ["Guilherme Moura Fernandes / Teloscorp"]
license = "LicenseRef-Proprietary-Owner"
edition = "2024"
rust-version = "1.93"

[lib]
name = "casulo_owner_ui_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "=2.6.3", features = [] }

[dependencies]
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.149"
sha2 = "=0.10.9"
tauri = { version = "=2.11.5", features = [] }

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
